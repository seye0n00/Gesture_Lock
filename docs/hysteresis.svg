<svg xmlns="http://www.w3.org/2000/svg" viewBox="30 25 710 480" width="710" height="480" font-family="'Noto Sans CJK KR','Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="30" y="25" width="710" height="480" fill="#ffffff"/>

  <!-- 히스테리시스 구간 -->
  <g fill="#FBEFD9" stroke="#999" stroke-width="1" stroke-dasharray="4 3">
    <rect x="181" y="55" width="132" height="351"/>
    <rect x="467" y="55" width="133" height="351"/>
  </g>

  <!-- 상태 기준선 -->
  <g stroke="#aaa" stroke-width="1.2" stroke-dasharray="1.5 3">
    <line x1="88" y1="143" x2="710" y2="143"/>
    <line x1="88" y1="242" x2="710" y2="242"/>
    <line x1="88" y1="341" x2="710" y2="341"/>
  </g>

  <!-- 축 -->
  <g stroke="#222" stroke-width="2" fill="#222">
    <line x1="88" y1="40" x2="88" y2="406"/>
    <line x1="88" y1="406" x2="712" y2="406"/>
    <polygon points="711,399 724,406 711,413" stroke="none"/>
  </g>

  <!-- 라벨 -->
  <g font-size="13" fill="#222" text-anchor="middle">
    <text x="122" y="51">판정 상태</text>
    <text x="388" y="72">Z 단일값</text>
    <text x="246" y="73">히스테리시스 구간</text>
    <text x="246" y="89">R 또는 Z</text>
    <text x="533" y="73">히스테리시스 구간</text>
    <text x="533" y="89">Z 또는 L</text>
    <text x="684" y="393">x축 가속도</text>
  </g>
  <g font-size="15" font-weight="bold" fill="#222" text-anchor="middle">
    <text x="60" y="148">L</text>
    <text x="60" y="246">Z</text>
    <text x="60" y="345">R</text>
  </g>

  <!-- 임계값 눈금 -->
  <g text-anchor="middle" fill="#222">
    <g font-size="14" font-weight="bold">
      <text x="180" y="431">-11585</text>
      <text x="312" y="431">-4240</text>
      <text x="466" y="431">+4240</text>
      <text x="599" y="431">+11585</text>
    </g>
    <g font-size="14">
      <text x="180" y="448">약 -45°</text>
      <text x="312" y="448">약 -15°</text>
      <text x="466" y="448">약 +15°</text>
      <text x="599" y="448">약 +45°</text>
    </g>
  </g>

  <!-- "이전 상태에 의존" 라벨 -->
  <g font-size="11" fill="#222" text-anchor="middle">
    <rect x="205" y="212" width="80" height="15" fill="#FBEFD9"/>
    <rect x="494" y="114" width="80" height="15" fill="#FBEFD9"/>
    <text x="245" y="224">이전 상태에 의존</text>
    <text x="534" y="126">이전 상태에 의존</text>
  </g>

  <!-- x 증가 시 전이 (파랑 실선) -->
  <g fill="none" stroke="#3B8BE6" stroke-width="3" stroke-linejoin="miter">
    <polyline points="88,344 313,344 313,245 600,245 600,146 714,146"/>
  </g>
  <g fill="#3B8BE6">
    <polygon points="223,337 236,344 223,351"/>
    <polygon points="382,238 395,245 382,252"/>
    <polygon points="306,302 313,289 320,302"/>
    <polygon points="593,206 600,193 607,206"/>
    <polygon points="656,139 669,146 656,153"/>
  </g>

  <!-- x 감소 시 전이 (빨강 점선) -->
  <g fill="none" stroke="#E04B4B" stroke-width="3" stroke-dasharray="18 10">
    <polyline points="714,140 467,140 467,238 181,238 181,337 102,337"/>
  </g>
  <g fill="#E04B4B">
    <polygon points="662,133 649,140 662,147"/>
    <polygon points="460,173 467,186 474,173"/>
    <polygon points="409,231 396,238 409,245"/>
    <polygon points="174,278 181,291 188,278"/>
    <polygon points="146,330 133,337 146,344"/>
  </g>

  <!-- 전이 설명 -->
  <g font-size="13">
    <text x="612" y="188" fill="#3B8BE6" font-weight="bold">Z→L 진입</text>
    <text x="612" y="205" fill="#222">x ≥ +11585</text>
    <text x="453" y="188" fill="#E04B4B" font-weight="bold" text-anchor="end">L→Z 복귀</text>
    <text x="453" y="205" fill="#222" text-anchor="end">x &lt; +4240</text>
    <text x="327" y="292" fill="#3B8BE6" font-weight="bold">R→Z 복귀</text>
    <text x="327" y="309" fill="#222">x &gt; -4240</text>
    <text x="168" y="294" fill="#E04B4B" font-weight="bold" text-anchor="end">Z→R 진입</text>
    <text x="168" y="311" fill="#222" text-anchor="end">x ≤ -11585</text>
  </g>

  <!-- 범례 -->
  <g font-size="13" fill="#222">
    <line x1="88" y1="481" x2="128" y2="481" stroke="#3B8BE6" stroke-width="3"/>
    <text x="136" y="485">x 증가 시 상태 전이</text>
    <line x1="264" y1="481" x2="283" y2="481" stroke="#E04B4B" stroke-width="3"/>
    <line x1="297" y1="481" x2="304" y2="481" stroke="#E04B4B" stroke-width="3"/>
    <text x="311" y="485">x 감소 시 상태 전이</text>
    <rect x="440" y="472" width="23" height="18" fill="#FBEFD9" stroke="#E0A040" stroke-width="1"/>
    <text x="472" y="485">히스테리시스 구간: 이전 판정 방향에 의존</text>
  </g>
</svg>
